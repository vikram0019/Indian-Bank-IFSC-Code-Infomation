; Local-dev tuning: the default opcache.revalidate_freq=2 re-stat()s every
; included file every ~2s, which is expensive with wp-content bind-mounted from
; a Windows host (WordPress core + Kadence Blocks load hundreds of files/request).
; Disabling timestamp validation removes that per-request stat() cost entirely.
; Trade-off: after editing PHP files, restart the wordpress container (or call
; opcache_reset()) to pick up changes instead of them applying automatically.
opcache.validate_timestamps=0
opcache.max_accelerated_files=10000
opcache.memory_consumption=256
